server.port=8080
spring.application.name=payment-orchestration

# H2 Database (Persistence Layer + Idempotency Store)
spring.datasource.url=jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# Payment Orchestration Config
payment.retry.max-attempts=3
payment.retry.delay-ms=500
payment.idempotency.ttl-seconds=86400

# Provider A config (handles CARD payments)
payment.provider.a.name=ProviderA
payment.provider.a.base-url=https://mock-provider-a.yuno.internal
payment.provider.a.timeout-ms=5000
payment.provider.a.failure-rate=0.2

# Provider B config (handles UPI payments)
payment.provider.b.name=ProviderB
payment.provider.b.base-url=https://mock-provider-b.yuno.internal
payment.provider.b.timeout-ms=5000
payment.provider.b.failure-rate=0.1
